[project]
name = "gcrr"
version = "0.1.0"
description = "Code accompanying the GCRR-GC binomial option pricing paper (Chen and Davila)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=3.0.3",
    "openpyxl>=3.1.5",
    "matplotlib>=3.8",
    "sympy>=1.14.0",
    "mpmath>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
