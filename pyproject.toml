[project]
name = "gcrr"
version = "0.1.0"
description = "GCRR-GC binomial option pricing schemes (private research)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "scipy>=1.11",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
